name: build
on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "package.json"
  pull_request:
    branches:
      - master
    paths:
      - "package.json"

# 显式授予写入权限：创建 Release / 推送 tag 需要 contents: write
# packages: write 用于后续可能的 GHCR 推送（当前未启用，可留作扩展）
permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: "master"
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
      - name: Install dependencies
        run: |
          npm install -g pnpm
          pnpm config set registry https://registry.npmmirror.com
          pnpm i --no-frozen-lockfile
      - name: build
        run: |
          pnpm build
      - name: zip
        run: |
          zip -r dist.zip dist
      - id: tag
        name: Generate release tag
        run: |
          SUB_STORE_RELEASE=`node --eval="process.stdout.write(require('./package.json').version)"`
          echo "release_tag=$SUB_STORE_RELEASE" >> $GITHUB_OUTPUT
      - name: Prepare release
        run: |
          pnpm i -D conventional-changelog-cli
          pnpm run changelog
      - name: Release
        uses: softprops/action-gh-release@v2
        if: ${{ success() }}
        env:
          # 优先使用自定义 PAT（如未配置则回退仓库默认 GITHUB_TOKEN）
          # 请在仓库 Settings → Secrets 中新增 RELEASE_TOKEN，权限需包含 repo (contents: write)
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          body_path: ./CHANGELOG.md
          tag_name: ${{ steps.tag.outputs.release_tag }}
          # generate_release_notes: true
          files: |
            dist.zip
      # 设置 QEMU 以支持多架构（amd64/arm64）镜像构建
      - name: Set up QEMU
        if: ${{ success() }}
        uses: docker/setup-qemu-action@v3
      # 启用 Docker Buildx，提供 buildkit 多架构构建能力
      - name: Set up Docker Buildx
        if: ${{ success() }}
        uses: docker/setup-buildx-action@v3
      # 登录 Docker Hub（用户名与密钥均从仓库 Secrets 读取，避免硬编码）
      - name: Login to Docker Hub
        if: ${{ success() }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # 构建并推送多架构镜像，tag 与 package.json 中的版本号一致，同时打 latest
      - name: Build and push Docker image
        if: ${{ success() }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/sub-store-front-end:${{ steps.tag.outputs.release_tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/sub-store-front-end:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
