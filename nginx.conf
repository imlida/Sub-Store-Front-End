# Sub-Store-Front-End nginx 配置
# 关键点：Vue Router 使用 createWebHistory（HTML5 history 模式），
# 直接访问 /subs、/sync 等路径时需要回退到 index.html，否则会出现 404

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # gzip 压缩静态资源（JS/CSS 较大，开启后显著减小传输体积）
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/x-javascript
        image/svg+xml;
    gzip_vary on;

    # SPA 路由 fallback：未命中文件则交给 index.html，由前端路由接管
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的静态资源可长时间缓存
    location ~* \.(?:js|css|woff2?|ttf|eot|png|jpg|jpeg|gif|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # index.html 不缓存，保证发版后用户能拿到最新入口文件
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # 安全相关头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
