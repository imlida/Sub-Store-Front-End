# Sub-Store nginx 配置（前后端一体镜像）
# 关键点：
#   1. Vue Router 使用 createWebHistory（HTML5 history 模式），
#      直接访问 /subs、/sync 等路径时需要回退到 index.html，否则会出现 404
#   2. 后端 API 反向代理到容器内的 Sub-Store 后端（127.0.0.1:3000）
#      后端实际响应路径是 ${BACKEND_PATH}/api/...，其中 ${BACKEND_PATH} 取自
#      环境变量 SUB_STORE_FRONTEND_BACKEND_PATH（默认为空，此时后端响应 /api/...）
#      ${BACKEND_PATH} 占位符在容器启动时由 docker-entrypoint.sh 通过 envsubst 渲染

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # 上传/导入订阅可能较大，适当放开
    client_max_body_size 50m;

    # gzip 压缩静态资源（JS/CSS 较大，开启后显著减小传输体积）
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/x-javascript
        image/svg+xml;
    gzip_vary on;

    # ─────────── 后端 API 反向代理 ───────────
    # 浏览器请求 http://<host>:80${BACKEND_PATH}/api/...
    # 由 nginx 转发到本机 node 后端 127.0.0.1:3000，实际路径保持不变
    # 注意：proxy_pass 不能带尾部 URI，这样 nginx 会把完整请求路径透传给后端
    location ${BACKEND_PATH}/api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 关闭缓冲，确保流式接口（如日志、长连接）正常
        proxy_buffering   off;
        proxy_request_buffering off;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # SPA 路由 fallback：未命中文件则交给 index.html，由前端路由接管
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的静态资源可长时间缓存
    location ~* \.(?:js|css|woff2?|ttf|eot|png|jpg|jpeg|gif|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # index.html 不缓存，保证发版后用户能拿到最新入口文件
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # 安全相关头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
